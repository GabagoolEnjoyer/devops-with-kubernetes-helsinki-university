apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app-server
  template:
    metadata:
      labels:
        app: todo-app-server
    spec:
      containers:
        - name: todo-app-server
          image: levvlasov1337/todo-app-server:latest